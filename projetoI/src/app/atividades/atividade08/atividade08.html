<p>Atividade 08</p>

<label>Produto:</label>
<input
  type="text"
  [(ngModel)]="produto">

<br><br>

<label>Preço:</label>
<input
  type="number"
  [(ngModel)]="preco">

<br><br>

<label>Quantidade:</label>
<input
  type="number"
  [(ngModel)]="quantidade">

<hr>

<p>Produto: {{ produto }}</p>

<p>Preço: {{ preco | currency:'BRL' }}</p>

<p>Quantidade: {{ quantidade }}</p>

<p>Total: {{ preco * quantidade | currency:'BRL' }}</p>
