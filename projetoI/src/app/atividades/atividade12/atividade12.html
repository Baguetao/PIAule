<p>Desafio Final - Matrícula</p>

<label>Nome do aluno:</label>

<input
  type="text"
  [(ngModel)]="nomeAluno">

<p>Aluno: {{ nomeAluno }}</p>

<p>Quantidade de disciplinas: {{ disciplinas }}</p>

<button
  (click)="diminuir()"
  [disabled]="disciplinas === 1">
  -
</button>

<button (click)="aumentar()">
  +
</button>

<br><br>

<button
  (click)="realizarMatricula()"
  [disabled]="nomeAluno.trim() === ''">
  Realizar Matrícula
</button>

<p>{{ mensagem }}</p>
